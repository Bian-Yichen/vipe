buffer: 1024
# weight for translation / rotation components of flow
beta: 0.3
# how much motion before considering new keyframe
filter_thresh: 2.4
# number of warmup frames
warmup: 8
# threshold to create a new keyframe
keyframe_thresh: 4.0
# add edges between frames whithin this distance
frontend_thresh: 16.0
# frontend optimization window
frontend_window: 25
# force edges between frames within radius
frontend_radius: 2
# non-maximal supression of edges
frontend_nms: 1
# Whether to initialize sequentially
seq_init: true
# Keyframe ids for running backends
frontend_backend_iters: [16, 64, 256]
backend_thresh: 22.0
backend_radius: 2
backend_nms: 3
backend_iters: 24

# Optional intrachunk loop closure. Disabled by default so the stock solver is
# numerically unchanged unless explicitly requested by the room-tour CLI.
loop_closure:
  enabled: false
  min_frame_gap: 300
  min_keyframe_gap: 12
  retrieval_top_k: 4
  similarity_threshold: 0.45
  max_candidates: 48
  candidate_nms: 4
  sequence_radius: 2
  min_sequence_support: 2
  droid_retrieval_weight: 0.35
  spatial_retrieval_radius: 4.5
  spatial_retrieval_top_k: 24
  spatial_max_candidates: 20
  spatial_candidate_nms: 6
  vlad_words: 24
  vlad_sample_descriptors: 12000
  vlad_kmeans_iters: 8
  max_features: 2048
  ratio_test: 0.78
  min_matches: 35
  min_inliers: 24
  min_inlier_ratio: 0.28
  max_reprojection_error: 2.5
  max_cycle_rotation_deg: 5.0
  max_cycle_translation: 0.30
  max_pose_correction_rotation_deg: 35.0
  max_pose_correction_translation: 3.0
  cluster_radius: 8
  min_cluster_support: 2
  max_loop_edges: 32
  switch_prior_weight: 25.0
  min_switch_weight: 0.25
  pose_graph_max_local_change: 0.35
  pose_graph_max_nfev: 60
  # v3: viewpoint-invariant registration of short SLAM point-cloud windows.
  submap_filter_thresh: 0.05
  submap_radius_small: 3
  submap_radius_large: 5
  submap_voxel_size: 0.08
  submap_correlation_voxel_size: 0.10
  submap_correlation_peaks: 5
  submap_max_correlation_cells: 8000000
  submap_max_translation: 3.0
  submap_max_rotation_deg: 15.0
  submap_icp_max_correspondence: 0.55
  submap_evaluation_distance: 0.20
  submap_min_symmetric_overlap: 0.20
  submap_min_mutual_correspondences: 220
  submap_max_rmse: 0.12
  submap_min_normal_consistency: 0.62
  submap_max_chromaticity_error: 0.14
  submap_translation_consistency: 0.40
  submap_rotation_consistency_deg: 4.0
  submap_min_ambiguity_ratio: 1.02
# Initial values for disparity
init_disp: 1.0
# Whether to optimize intrinsics
optimize_intrinsics: ???
# Whether to optimize rig
optimize_rig_rotation: false
# Whether add reproj factors for cross-views
cross_view: true
cross_view_idx: null  # null means default
adaptive_cross_view: false  # Backend only, recompute cross_view_idx
# Chunk size of the infill
infill_chunk_size: 16
# Whether or not to infill dense disparity
infill_dense_disp: False
# Filter threshold for SLAM map (percentage of the mean depth difference allowed)
# (This is also used for dense disp extraction)
map_filter_thresh: 0.05
# Whether to visualize the results using rerun
visualize: false
# Use keyframe depth for recovering metric depth
keyframe_depth: metric3d-small

ba:
  dense_disp_alpha: 0.001
  # true | false | auto. auto enables the fused CUDA path when the pipeline layout is
  # compatible (single-view pinhole, no robust kernel, no rig-rotation optimization,
  # no sparse tracks).
  fused: auto
  intrinsics_damping_scale: 1.0
  # robust kernel for dense-flow residual: null (L2) | huber | tukey | gnc_tls
  robust_kernel: null
  # kernel threshold in /8 feature-map pixels (Huber k / Tukey c / GNC-TLS c_bar)
  robust_kernel_threshold: 3.0
  # GNC-TLS mu schedule (ignored unless robust_kernel == gnc_tls)
  gnc_mu_init: 1.0
  gnc_mu_step: 3.0
  gnc_mu_max: 1.0e6
  gnc_n_mu_steps: 4
  gnc_gn_iters_per_mu: 6

sparse_tracks:
  name: dummy
